<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="syncTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="syncAccent" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(45, 212, 191, 0.3)" stroke-width="2"/>

  <!-- Stylized "S" & Sync Arrows Loop -->
  <g filter="url(#glow)">
    <!-- Top Arc & Arrow (Upper loop of S) -->
    <path d="M 88 42 C 88 28, 72 22, 58 22 C 40 22, 28 32, 28 46 C 28 62, 50 64, 64 68 C 80 72, 96 78, 96 94 C 96 110, 80 118, 64 118 C 46 118, 34 110, 32 96" 
          fill="none" 
          stroke="url(#syncTeal)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Upper Sync Arrowhead -->
    <path d="M 76 34 L 92 42 L 96 26" 
          fill="none" 
          stroke="url(#syncTeal)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Lower Sync Arrowhead -->
    <path d="M 46 104 L 32 96 L 28 112" 
          fill="none" 
          stroke="url(#syncAccent)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central Tech Node / Pulse Point -->
    <circle cx="64" cy="68" r="4.5" fill="#f0fdfa"/>
  </g>
</svg>
